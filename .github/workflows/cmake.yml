name: CMake + CTest

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libopencv-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build unit tests
        run: cmake --build build --target GestureRecognizerUnitTests -j 2

      - name: Run tests
        run: ctest --test-dir build -R GestureRecognizerUnitTests --output-on-failure -V

